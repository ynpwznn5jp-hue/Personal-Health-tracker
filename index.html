<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Life Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0E0F12">
<style>
:root{--bg:#0E0F12;--card:#17181D;--line:#242630;--tx:#E8E4DC;--mut:#8A8F98;--amb:#E0A458;--ok:#7FB069;--bad:#C96F5E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,sans-serif}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
header{padding-top:calc(8px + env(safe-area-inset-top))}
h1{font-size:20px;margin:0}
.date{color:var(--mut);font-size:13px;margin-top:2px}
.eyebrow{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.18em;color:var(--amb);text-transform:uppercase;margin:26px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.qlabel{font-size:15px;font-weight:600}
.help{color:var(--mut);font-size:12.5px;margin-top:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
input[type=range]{width:100%;margin:14px 0 4px;accent-color:var(--amb);height:28px}
.val{font-family:ui-monospace,Menlo,monospace;font-size:15px;color:var(--amb);min-width:26px;text-align:right}
.val.unset{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:transparent;color:var(--tx);border-radius:999px;padding:9px 15px;font-size:14px}
.chip.on{background:var(--amb);border-color:var(--amb);color:#141310;font-weight:600}
.seg{display:flex;gap:6px}
.seg .chip{padding:7px 13px}
input[type=number],input[type=text],input[type=email],input[type=password],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font-size:16px;margin-top:8px}
textarea{min-height:64px;resize:vertical}
.branch{display:none;margin-top:10px;border-left:3px solid var(--amb);padding-left:10px}
.branch.show{display:block}
.branch .bp{font-size:13px;color:var(--amb)}
.defrow{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.defrow:last-child{border-bottom:0}
button.big{width:100%;background:var(--amb);color:#141310;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;margin-top:16px}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(14,15,18,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;text-align:center;padding:13px 0 11px;color:var(--mut);font-size:12.5px;border:0;background:none}
.tab.on{color:var(--amb)}
.dots{display:flex;gap:6px;margin:6px 0 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--amb);color:#141310;font-weight:600;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.err{border-color:var(--bad) !important}
.msg{color:var(--mut);font-size:14px;margin-top:10px;min-height:20px}
.qmeta{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mut)}
.small{font-size:13px;color:var(--mut)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style></head><body>
<div class="wrap" id="app"><p class="small">Loading…</p></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
function showFatal(msg){ var a = document.getElementById('app'); if(a) a.innerHTML = '<div class="card" style="margin-top:40px"><div class="qlabel">Something broke on startup</div><div class="help" style="margin-top:6px">' + msg + '</div><div class="help" style="margin-top:10px">Try closing the app fully and reopening it. If this keeps happening, show this message to Claude.</div></div>'; }
window.addEventListener('error', function(e){ showFatal(e.message || 'Unknown error'); });
window.addEventListener('unhandledrejection', function(e){ showFatal((e.reason && e.reason.message) || 'A network or database call failed.'); });
setTimeout(function(){ var a = document.getElementById('app'); if(a && a.textContent.indexOf('Loading') !== -1) showFatal('Startup timed out, most likely a bad internet connection.'); }, 8000);
if(!window.supabase){ throw new Error('The database library failed to download (CDN unreachable or blocked).'); }
const { createClient } = window.supabase;
const sb = createClient('https://xclakdqywukfccfggzyn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjbGFrZHF5d3VrZmNjZmdnenluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNTIwNDQsImV4cCI6MjEwMjcyODA0NH0.X3dwADB9gxU3sxeoHjNRxoT6ejSH7Q2HCHZmm-GPYRc');
const $ = s => document.querySelector(s);
const app = $('#app');
let Q = [], answers = {}, touched = new Set(), loaded = new Set(), branchTx = {}, note = '', existing = false, tab = location.hash === '#ping' ? 'ping' : 'today';
const PING_ACTS = ['Studying','Class','Work','Social','Eating','Chores','Exercise','Commuting','Phone / scrolling','Entertainment','Meditating','Resting','Other'];

function entryDate(){ const d = new Date(Date.now() - 4*3600*1000); const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function lateNight(){ return new Date().getHours() < 4; }
function addDays(iso, n){ const t = new Date(iso+'T12:00:00'); t.setDate(t.getDate()+n); const p = x => String(x).padStart(2,'0'); return t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate()); }
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'), 1800); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stackItems(q){ return (q.options && q.options.stack) || []; }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderAuth(); } else { await loadAll(); render(); }
  sb.auth.onAuthStateChange(async (ev, s) => { if(ev==='SIGNED_IN' && document.getElementById('am')){ await loadAll(); render(); } if(ev==='SIGNED_OUT'){ renderAuth(); } });
}

function renderAuth(){
  app.innerHTML = '<header><h1>Life Tracker</h1><div class="date">Private. One account owns this data.</div></header>'
    + '<div class="card" style="margin-top:22px"><input id="em" type="email" placeholder="Email" autocomplete="username">'
    + '<input id="pw" type="password" placeholder="Password" autocomplete="current-password">'
    + '<button class="big" id="si">Sign in</button>'
    + '<button class="ghost" id="su" style="width:100%;margin-top:10px">Create the owner account</button>'
    + '<div class="msg" id="am"></div></div>';
  $('#si').onclick = async () => { const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value }); if(error){ $('#am').textContent = error.message; } };
  $('#su').onclick = async () => { const { data, error } = await sb.auth.signUp({ email: $('#em').value.trim(), password: $('#pw').value }); $('#am').textContent = error ? error.message : (data.session ? '' : 'Check your email to confirm the account, then sign in here.'); };
}

async function loadAll(){
  const { data: qs, error } = await sb.from('survey_questions').select('*').eq('active', true).order('sort_order');
  if(error){ toast(error.message); return; }
  Q = qs || [];
  answers = {}; touched = new Set(); loaded = new Set(); branchTx = {}; note=''; existing = false;
  const d = entryDate();
  const { data: ent } = await sb.from('daily_entries').select('note').eq('entry_date', d).maybeSingle();
  if(ent){ existing = true; note = ent.note || ''; }
  const { data: ans } = await sb.from('daily_answers').select('question_id,value,touched').eq('entry_date', d);
  const byId = {}; Q.forEach(q => byId[q.id] = q);
  (ans||[]).forEach(a => { const q = byId[a.question_id]; if(q){ answers[q.key] = a.value; loaded.add(q.key); if(a.touched) touched.add(q.key); } });
  const { data: att } = await sb.from('attributions').select('question_id,body').eq('entry_date', d);
  (att||[]).forEach(a => { const q = byId[a.question_id]; if(q) branchTx[q.key] = a.body; });
}

function render(){
  if(tab==='today') renderToday(); else if(tab==='ping') renderPing(); else renderSettings();
}
function tabBar(){
  let bar = '<div class="tabs">';
  [['today','Today'],['ping','Ping'],['settings','Settings']].forEach(p => { bar += '<button class="tab '+(tab===p[0]?'on':'')+'" data-t="'+p[0]+'">'+p[1]+'</button>'; });
  bar += '</div>';
  app.insertAdjacentHTML('beforeend', bar);
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
}

function defOf(q){ return q.default_value; }

function control(q){
  const key = q.key, v = answers[key];
  if(q.input_type === 'slider'){
    const has = (key in answers);
    let h = '<div class="row"><div><div class="qlabel">'+esc(q.label)+'</div>'+(q.help_text?'<div class="help">'+esc(q.help_text)+'</div>':'')+'</div><div class="val '+(has?'':'unset')+'" id="v_'+key+'">'+(has?v:'–')+'</div></div>';
    h += '<input type="range" min="'+(q.min_value??0)+'" max="'+(q.max_value??10)+'" step="1" value="'+(has?v:Math.round(((+q.min_value||0)+(+q.max_value||10))/2))+'" data-k="'+key+'" data-c="slider">';
    if(q.branch && q.branch.type === 'extreme_text'){
      const show = has && (v >= q.branch.high_at || v <= q.branch.low_at);
      h += '<div class="branch '+(show?'show':'')+'" id="b_'+key+'"><div class="bp">'+esc(q.branch.prompt)+' (optional)</div><textarea data-bk="'+key+'">'+esc(branchTx[key]||'')+'</textarea></div>';
    }
    return '<div class="card">'+h+'</div>';
  }
  if(q.input_type === 'toggle'){
    const on = v === true || (v && (v.on === true || v.taken === true));
    const offSel = v === false || (v && (v.on === false || v.taken === false));
    let h = '<div class="row"><div><div class="qlabel">'+esc(q.label)+'</div>'+(q.help_text?'<div class="help">'+esc(q.help_text)+'</div>':'')+'</div>';
    h += '<div class="seg"><button class="chip '+(on?'on':'')+'" data-k="'+key+'" data-c="tog" data-v="1">Yes</button><button class="chip '+(offSel?'on':'')+'" data-k="'+key+'" data-c="tog" data-v="0">No</button></div></div>';
    if(q.branch && q.branch.type === 'reveal_number'){
      h += '<div class="branch '+(on?'show':'')+'" id="rn_'+key+'"><div class="bp">'+esc(q.branch.label)+'</div><input type="number" inputmode="decimal" step="'+(q.branch.step||1)+'" min="'+(q.branch.min||0)+'" max="'+(q.branch.max||24)+'" value="'+esc(v&&v.hours!=null?v.hours:'')+'" data-nk="'+key+'"></div>';
    }
    if(q.branch && q.branch.type === 'stack_list'){
      h += stackBranch(q, on);
    }
    if(q.branch && q.branch.type === 'detail_reveal'){
      h += detailBranch(q, on);
    }
    return '<div class="card">'+h+'</div>';
  }
  if(q.input_type === 'select'){
    const vv = (key in answers) ? v : defOf(q);
    let h = '<div class="qlabel">'+esc(q.label)+'</div>'+(q.help_text?'<div class="help">'+esc(q.help_text)+'</div>':'')+'<div class="chips">';
    (q.options||[]).forEach(o => { h += '<button class="chip '+(vv===o.value?'on':'')+'" data-k="'+key+'" data-c="sel" data-v="'+esc(o.value)+'">'+esc(o.label)+'</button>'; });
    h += '</div>';
    return '<div class="card">'+h+'</div>';
  }
  if(q.input_type === 'number'){
    return '<div class="card"><div class="qlabel">'+esc(q.label)+'</div>'+(q.help_text?'<div class="help">'+esc(q.help_text)+'</div>':'')+'<input type="number" inputmode="decimal" min="'+(q.min_value??'')+'" max="'+(q.max_value??'')+'" value="'+esc(v!=null?v:(defOf(q)!=null?defOf(q):''))+'" data-k="'+key+'" data-c="num"></div>';
  }
  return '';
}

function stackBranch(q, on){
  const key = q.key, cur = answers[key];
  const items = stackItems(q);
  const took = new Set((cur && cur.taken === false && cur.took) || []);
  let h = '<div class="branch '+(!on && (key in answers) ?'show':'')+'" id="sl_'+key+'" style="margin:6px 0 10px"><div class="bp">'+esc(q.branch.label||'Which ones did you take?')+'</div>';
  if(items.length){
    h += '<div class="chips">';
    items.forEach(it => { h += '<button class="chip '+(took.has(it.name)?'on':'')+'" data-sk="'+key+'" data-sn="'+esc(it.name)+'">'+esc(it.name)+'</button>'; });
    h += '</div>';
  } else {
    h += '<div class="small">Your stack is empty. Add items in Settings.</div>';
  }
  h += '</div>';
  return h;
}

function detailBranch(q, on){
  const key = q.key, cur = answers[key];
  const val = f => (cur && typeof cur === 'object' && cur[f.key] != null) ? cur[f.key] : null;
  let h = '<div class="branch '+(on?'show':'')+'" id="dl_'+key+'" style="margin:6px 0 10px"><div class="bp">A little more detail (optional)</div>';
  (q.branch.fields||[]).forEach(f => {
    if(f.type === 'number'){
      h += '<div class="help" style="margin-top:8px">'+esc(f.label)+'</div><input type="number" inputmode="decimal" step="'+(f.step||1)+'" min="0" value="'+esc(val(f)!=null?val(f):'')+'" data-dnf="'+f.key+'" data-dnk="'+key+'">';
    } else if(f.type === 'toggle'){
      h += '<div class="help" style="margin-top:8px">'+esc(f.label)+'</div><div class="seg" style="margin-top:6px"><button class="chip '+(val(f)===true?'on':'')+'" data-dk="'+key+'" data-df="'+f.key+'" data-dv="__yes">Yes</button><button class="chip '+(val(f)===false?'on':'')+'" data-dk="'+key+'" data-df="'+f.key+'" data-dv="__no">No</button></div>';
    } else {
      h += '<div class="help" style="margin-top:8px">'+esc(f.label)+'</div><div class="chips">';
      (f.options||[]).forEach(o => { h += '<button class="chip '+(val(f)===o.value?'on':'')+'" data-dk="'+key+'" data-df="'+f.key+'" data-dv="'+esc(o.value)+'">'+esc(o.label)+'</button>'; });
      h += '</div>';
    }
  });
  h += '</div>';
  return h;
}

function defRow(q){
  const key = q.key;
  const cur = (key in answers) ? answers[key] : defOf(q);
  const on = cur === true || (cur && (cur.on === true || cur.taken === true));
  let h = '<div class="defrow"><div class="qlabel" style="font-weight:500">'+esc(q.label)+'</div>';
  h += '<div class="seg"><button class="chip '+(on?'on':'')+'" data-k="'+key+'" data-c="tog" data-v="1">Yes</button><button class="chip '+(!on?'on':'')+'" data-k="'+key+'" data-c="tog" data-v="0">No</button></div></div>';
  if(q.branch && q.branch.type === 'reveal_number'){
    h += '<div class="branch '+(on?'show':'')+'" id="rn_'+key+'" style="margin:6px 0 10px"><div class="bp">'+esc(q.branch.label)+'</div><input type="number" inputmode="decimal" step="'+(q.branch.step||1)+'" value="'+esc(cur&&cur.hours!=null?cur.hours:'')+'" data-nk="'+key+'"></div>';
  }
  if(q.branch && q.branch.type === 'stack_list'){
    h += stackBranch(q, on);
  }
  if(q.branch && q.branch.type === 'detail_reveal'){
    h += detailBranch(q, on);
  }
  return h;
}

async function renderToday(){
  const d = entryDate();
  let h = '<header><h1>'+(existing?'Update today':'Evening check-in')+'</h1><div class="date">'+d+(lateNight()?' · after midnight, logging for yesterday':'')+'</div><div class="dots" id="dots"></div></header>';
  h += '<div id="monthly"></div>';
  h += '<div class="eyebrow">Outcomes</div>';
  Q.filter(q=>q.section==='outcomes').forEach(q => h += control(q));
  h += '<div class="eyebrow">Behaviors</div>';
  Q.filter(q=>q.section==='behaviors').forEach(q => h += control(q));
  h += '<div class="eyebrow">Quick confirm · tap only if different</div><div class="card">';
  Q.filter(q=>q.section==='defaults').forEach(q => h += defRow(q));
  h += '</div>';
  h += '<div id="recall"></div>';
  h += '<div class="card"><div class="qlabel">Anything worth noting? <span class="qmeta">optional</span></div><textarea id="note">'+esc(note)+'</textarea></div>';
  h += '<button class="big" id="save">'+(existing?'Update today':'Save today')+'</button><div style="height:8px"></div>';
  app.innerHTML = h;
  tabBar();
  wire();
  const sv = document.getElementById('save'); if(sv) sv.onclick = save;
  const nt = document.getElementById('note'); if(nt) nt.oninput = e => note = e.target.value;
  const { data: week } = await sb.from('daily_entries').select('entry_date').gte('entry_date', new Date(Date.now()-6*86400000).toISOString().slice(0,10));
  const have = new Set((week||[]).map(r=>r.entry_date));
  let dh = '';
  for(let i=6;i>=0;i--){ const dd = new Date(Date.now()-i*86400000).toISOString().slice(0,10); dh += '<div class="dot '+(have.has(dd)?'on':'')+'"></div>'; }
  const dotsEl = document.getElementById('dots'); if(dotsEl) dotsEl.innerHTML = dh;
  loadMonthly(d); loadRecall(d);
}

async function loadRecall(d){
  const host = document.getElementById('recall'); if(!host) return;
  const oq = Q.filter(q => q.section==='outcomes' && q.branch && q.branch.type==='extreme_text');
  if(!oq.length) return;
  const byId = {}; oq.forEach(q => byId[q.id] = q);
  const { data: ans } = await sb.from('daily_answers').select('entry_date,question_id,value').in('question_id', oq.map(q=>q.id)).gte('entry_date', addDays(d,-21)).lte('entry_date', addDays(d,-7));
  if(!ans || !ans.length) return;
  const { data: done } = await sb.from('delayed_recalls').select('about_date');
  const doneSet = new Set((done||[]).map(r => r.about_date));
  const byDay = {};
  ans.forEach(a => {
    if(doneSet.has(a.entry_date)) return;
    const q = byId[a.question_id]; const v = a.value;
    if(typeof v !== 'number') return;
    if(!(v >= q.branch.high_at || v <= q.branch.low_at)) return;
    const cur = byDay[a.entry_date];
    if(!cur || q.key === 'satisfaction') byDay[a.entry_date] = { q, v };
  });
  const days = Object.keys(byDay).sort();
  if(!days.length) return;
  const day = days[0], pick = byDay[day];
  host.innerHTML = '<div class="eyebrow">Looking back</div><div class="card"><div class="qlabel">On '+day+' you rated '+esc(pick.q.label)+' '+pick.v+'/10.</div><div class="help">Without checking anything, why do you think that day went the way it did?</div><textarea id="rc_tx"></textarea><button class="big" id="rc_save">Save memory</button><button class="ghost" id="rc_skip" style="width:100%;margin-top:8px">No real memory of it</button></div>';
  document.getElementById('rc_save').onclick = async () => {
    const t = document.getElementById('rc_tx').value.trim();
    if(!t){ toast('Write it, or tap no memory'); return; }
    const { error } = await sb.from('delayed_recalls').insert({ about_date: day, question_id: pick.q.id, prompted_on: d, body: t, skipped: false });
    if(error){ toast(error.message); return; }
    host.innerHTML = ''; toast('Saved');
  };
  document.getElementById('rc_skip').onclick = async () => {
    const { error } = await sb.from('delayed_recalls').insert({ about_date: day, question_id: pick.q.id, prompted_on: d, skipped: true });
    if(error){ toast(error.message); return; }
    host.innerHTML = ''; toast('Noted, and that is data too');
  };
}

async function loadMonthly(d){
  const host = document.getElementById('monthly'); if(!host) return;
  if(parseInt(d.slice(8,10), 10) > 7) return;
  const monthKey = d.slice(0,7) + '-01';
  const { data: mr } = await sb.from('monthly_reflections').select('month').eq('month', monthKey).maybeSingle();
  if(mr) return;
  host.innerHTML = '<div class="eyebrow">New month</div><div class="card">'
    + '<div class="row"><div class="qlabel">All things considered, how was last month?</div><div class="val unset" id="mr_v">–</div></div>'
    + '<input type="range" min="0" max="10" value="5" id="mr_s">'
    + '<div class="help" style="margin-top:10px">What defined it? How did it go?</div><textarea id="mr_went"></textarea>'
    + '<div class="help" style="margin-top:10px">What are you excited about in the coming month?</div><textarea id="mr_ex"></textarea>'
    + '<div class="help" style="margin-top:10px">What are you nervous about?</div><textarea id="mr_nv"></textarea>'
    + '<button class="big" id="mr_save">Save reflection</button>'
    + '<button class="ghost" id="mr_later" style="width:100%;margin-top:8px">Not tonight</button></div>';
  let sc = null;
  document.getElementById('mr_s').oninput = e => { sc = +e.target.value; const el = document.getElementById('mr_v'); el.textContent = sc; el.classList.remove('unset'); };
  document.getElementById('mr_save').onclick = async () => {
    if(sc == null){ toast('Slide the month rating first'); return; }
    const { error } = await sb.from('monthly_reflections').insert({ month: monthKey, score: sc, went: document.getElementById('mr_went').value.trim() || null, excited: document.getElementById('mr_ex').value.trim() || null, nervous: document.getElementById('mr_nv').value.trim() || null });
    if(error){ toast(error.message); return; }
    host.innerHTML = ''; toast('Reflection saved');
  };
  document.getElementById('mr_later').onclick = () => { host.innerHTML = ''; };
}

function wire(){
  document.querySelectorAll('[data-c=slider]').forEach(el => el.oninput = () => {
    const k = el.dataset.k, v = +el.value; answers[k] = v; touched.add(k);
    const q = Q.find(x=>x.key===k);
    const vb = document.getElementById('v_'+k); if(vb){ vb.textContent = v; vb.classList.remove('unset'); }
    if(q.branch && q.branch.type==='extreme_text'){ const b = document.getElementById('b_'+k); if(b) b.classList.toggle('show', v >= q.branch.high_at || v <= q.branch.low_at); }
  });
  document.querySelectorAll('[data-c=tog]').forEach(el => el.onclick = () => {
    const k = el.dataset.k, on = el.dataset.v === '1'; const q = Q.find(x=>x.key===k);
    if(q.branch && q.branch.type === 'stack_list'){
      const items = stackItems(q);
      if(on){ answers[k] = { taken: true, stack: items }; }
      else {
        const prev = answers[k];
        const kept = (prev && prev.taken === false && Array.isArray(prev.took)) ? prev.took : [];
        answers[k] = { taken: false, took: kept, stack: items };
      }
      const sl = document.getElementById('sl_'+k); if(sl) sl.classList.toggle('show', !on);
    } else if(q.branch && q.branch.type === 'detail_reveal'){
      if(on){ const prev = answers[k]; answers[k] = (prev && typeof prev === 'object' && prev.on) ? prev : { on: true }; }
      else { answers[k] = false; }
      const dl = document.getElementById('dl_'+k); if(dl) dl.classList.toggle('show', on);
    } else if(q.branch && q.branch.type==='reveal_number'){
      const hrsEl = document.querySelector('[data-nk="'+k+'"]');
      answers[k] = on ? { on: true, hours: hrsEl && hrsEl.value !== '' ? +hrsEl.value : null } : false;
      const rn = document.getElementById('rn_'+k); if(rn) rn.classList.toggle('show', on);
    } else { answers[k] = on; }
    touched.add(k);
    const seg = el.parentElement; seg.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
  });
  document.querySelectorAll('[data-sk]').forEach(el => el.onclick = () => {
    const k = el.dataset.sk, n = el.dataset.sn; const q = Q.find(x=>x.key===k);
    let cur = answers[k];
    if(!cur || cur.taken !== false){ cur = { taken: false, took: [], stack: stackItems(q) }; }
    if(!Array.isArray(cur.took)) cur.took = [];
    const i = cur.took.indexOf(n);
    if(i >= 0) cur.took.splice(i, 1); else cur.took.push(n);
    answers[k] = cur; touched.add(k);
    el.classList.toggle('on', i < 0);
  });
  document.querySelectorAll('[data-dk]').forEach(el => el.onclick = () => {
    const k = el.dataset.dk, f = el.dataset.df; let v = el.dataset.dv;
    if(v === '__yes') v = true; else if(v === '__no') v = false;
    let cur = answers[k];
    if(!cur || typeof cur !== 'object'){ cur = { on: true }; answers[k] = cur; }
    const was = el.classList.contains('on');
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
    if(was){ delete cur[f]; } else { cur[f] = v; el.classList.add('on'); }
    touched.add(k);
  });
  document.querySelectorAll('[data-dnf]').forEach(el => el.oninput = () => {
    const k = el.dataset.dnk, f = el.dataset.dnf;
    let cur = answers[k];
    if(!cur || typeof cur !== 'object'){ cur = { on: true }; answers[k] = cur; }
    cur[f] = el.value !== '' ? +el.value : null;
    touched.add(k);
  });
  document.querySelectorAll('[data-c=sel]').forEach(el => el.onclick = () => {
    const k = el.dataset.k; answers[k] = el.dataset.v; touched.add(k);
    el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === el));
  });
  document.querySelectorAll('[data-c=num]').forEach(el => el.oninput = () => { const k = el.dataset.k; if(el.value !== ''){ answers[k] = +el.value; touched.add(k); } });
  document.querySelectorAll('[data-nk]').forEach(el => el.oninput = () => { const k = el.dataset.nk; const cur = answers[k]; if(cur && cur.on){ cur.hours = el.value !== '' ? +el.value : null; } touched.add(k); });
  document.querySelectorAll('[data-bk]').forEach(el => el.oninput = (e) => { branchTx[el.dataset.bk] = e.target.value; });
}

async function save(){
  const missing = [];
  Q.forEach(q => {
    if(q.section === 'defaults') { if(!(q.key in answers)) answers[q.key] = defOf(q); return; }
    if(defOf(q) == null && !(q.key in answers)) missing.push(q.label);
    if(!(q.key in answers) && defOf(q) != null) answers[q.key] = defOf(q);
  });
  if(missing.length){ toast('Missing: ' + missing.join(', ')); return; }
  Q.forEach(q => {
    if(q.branch && q.branch.type === 'stack_list'){
      const v = answers[q.key], items = stackItems(q);
      if(v === true || v == null) answers[q.key] = { taken: true, stack: items };
      else if(v === false) answers[q.key] = { taken: false, took: [], stack: items };
    }
  });
  const d = entryDate();
  const { error: e1 } = await sb.from('daily_entries').upsert({ entry_date: d, note: note || null, submitted_at: new Date().toISOString() }, { onConflict: 'entry_date' });
  if(e1){ toast(e1.message); return; }
  const rows = Q.map(q => ({ entry_date: d, question_id: q.id, value: answers[q.key], touched: touched.has(q.key) || loaded.has(q.key) }));
  const { error: e2 } = await sb.from('daily_answers').upsert(rows, { onConflict: 'entry_date,question_id' });
  if(e2){ toast(e2.message); return; }
  await sb.from('attributions').delete().eq('entry_date', d);
  const atts = [];
  Q.forEach(q => { if(q.branch && q.branch.type==='extreme_text' && branchTx[q.key] && branchTx[q.key].trim()){ const v = answers[q.key]; if(v >= q.branch.high_at || v <= q.branch.low_at){ atts.push({ entry_date: d, question_id: q.id, direction: v >= q.branch.high_at ? 'high' : 'low', body: branchTx[q.key].trim() }); } } });
  if(atts.length){ await sb.from('attributions').insert(atts); }
  existing = true; toast('Saved'); render();
}

function renderPing(){
  let act = null, pres = null, feel = null;
  let h = '<header><h1>Right now</h1><div class="date">30 seconds, honest answers</div></header>';
  h += '<div class="eyebrow">What are you doing?</div><div class="card"><div class="chips" id="pacts">';
  PING_ACTS.forEach(a => h += '<button class="chip" data-a="'+esc(a)+'">'+esc(a)+'</button>');
  h += '</div></div>';
  h += '<div class="eyebrow">State</div>';
  h += '<div class="card"><div class="row"><div class="qlabel">How present are you?</div><div class="val unset" id="pv">–</div></div><input type="range" min="0" max="10" value="5" id="pr"></div>';
  h += '<div class="card"><div class="row"><div class="qlabel">How do you feel?</div><div class="val unset" id="fv">–</div></div><input type="range" min="0" max="10" value="5" id="fr"></div>';
  h += '<button class="big" id="psave">Log ping</button><div class="small" id="pcount" style="margin-top:10px"></div>';
  app.innerHTML = h;
  tabBar();
  document.querySelectorAll('#pacts .chip').forEach(c => c.onclick = () => { act = c.dataset.a; document.querySelectorAll('#pacts .chip').forEach(x=>x.classList.toggle('on', x===c)); });
  $('#pr').oninput = e => { pres = +e.target.value; const el=$('#pv'); el.textContent = pres; el.classList.remove('unset'); };
  $('#fr').oninput = e => { feel = +e.target.value; const el=$('#fv'); el.textContent = feel; el.classList.remove('unset'); };
  $('#psave').onclick = async () => {
    if(!act || pres==null || feel==null){ toast('Tap an activity and both sliders'); return; }
    const { error } = await sb.from('pings').insert({ activity: act, presence: pres, feeling: feel });
    if(error){ toast(error.message); return; }
    toast('Logged'); renderPing();
  };
  sb.from('pings').select('id', { count: 'exact', head: true }).gte('answered_at', new Date().toISOString().slice(0,10)+'T00:00:00').then(r => { const el = document.getElementById('pcount'); if(el) el.textContent = (r.count||0) + ' pings today'; });
}

function renderSettings(){
  let h = '<header><h1>Settings</h1><div class="date">The survey is data. Edit it here; the database adapts.</div></header>';
  h += '<div class="eyebrow">Survey questions</div>';
  ['outcomes','behaviors','defaults'].forEach(sec => {
    h += '<div class="card"><div class="qmeta" style="margin-bottom:8px">'+sec.toUpperCase()+'</div>';
    Q.filter(q=>q.section===sec).forEach(q => {
      h += '<div class="defrow"><div><div style="font-size:14px">'+esc(q.label)+'</div><div class="qmeta">'+q.input_type+'</div></div><div class="seg"><button class="ghost" data-rn="'+q.id+'">Rename</button><button class="ghost" data-rt="'+q.id+'">Retire</button></div></div>';
    });
    h += '</div>';
  });
  const sq = Q.find(q => q.branch && q.branch.type === 'stack_list');
  h += '<div class="eyebrow">Peptide + supplement stack</div><div class="card">';
  if(sq){
    const items = stackItems(sq);
    if(items.length){
      items.forEach((it, i) => { h += '<div class="defrow"><div><div style="font-size:14px">'+esc(it.name)+'</div><div class="qmeta">'+esc(it.type||'')+'</div></div><button class="ghost" data-sx="'+i+'">Remove</button></div>'; });
    } else {
      h += '<div class="small">Nothing in the stack yet. Add your first item below.</div>';
    }
    h += '<input type="text" id="st_name" placeholder="Item and dose, e.g. Creatine 5g">';
    h += '<select id="st_type"><option value="peptide">Peptide</option><option value="supplement">Supplement</option></select>';
    h += '<button class="big" id="st_add" style="margin-top:12px">Add to stack</button>';
    h += '<div class="help" style="margin-top:8px">Edits apply from tonight onward. Every saved day keeps its own copy of the stack as it was, so history never changes. A dose change should be an edit here (remove + re-add with the new dose).</div>';
  } else {
    h += '<div class="small">No stack question found in the registry.</div>';
  }
  h += '</div>';
  h += '<div class="eyebrow">Add a question</div><div class="card">';
  h += '<input type="text" id="nq_label" placeholder="Label (what the form shows)">';
  h += '<select id="nq_sec"><option value="outcomes">Outcomes</option><option value="behaviors" selected>Behaviors</option><option value="defaults">Auto-default (yes/no)</option></select>';
  h += '<select id="nq_type"><option value="slider">Slider 0-10</option><option value="toggle">Yes / No</option><option value="number">Number</option><option value="select">Choice chips</option></select>';
  h += '<input type="text" id="nq_opts" placeholder="Choices, comma separated (only for chips)">';
  h += '<select id="nq_def"><option value="">No default (must answer)</option><option value="false">Defaults to No</option><option value="true">Defaults to Yes</option></select>';
  h += '<button class="big" id="nq_add" style="margin-top:12px">Add question</button></div>';
  h += '<div class="eyebrow">Hypotheses</div><div class="card" id="hyp"><div class="small">Loading…</div></div>';
  h += '<div class="card"><textarea id="hyp_new" placeholder="Register a prediction before the data can tempt you…"></textarea><button class="big" id="hyp_add">Register hypothesis</button></div>';
  h += '<hr><button class="ghost" id="sout" style="width:100%">Sign out</button><div style="height:8px"></div>';
  app.innerHTML = h;
  tabBar();
  document.querySelectorAll('[data-rn]').forEach(b => b.onclick = async () => {
    const q = Q.find(x=>x.id===b.dataset.rn);
    const nl = prompt('New label. If the MEANING changes, retire this question and add a new one instead.', q.label);
    if(nl && nl.trim() && nl !== q.label){ const { error } = await sb.from('survey_questions').update({ label: nl.trim() }).eq('id', q.id); if(error) toast(error.message); else { await loadAll(); render(); } }
  });
  document.querySelectorAll('[data-rt]').forEach(b => b.onclick = async () => {
    const q = Q.find(x=>x.id===b.dataset.rt);
    if(confirm('Retire "'+q.label+'"? Its history is kept; it just stops appearing.')){
      const { error } = await sb.from('survey_questions').update({ active: false, retired_at: new Date().toISOString() }).eq('id', q.id);
      if(error) toast(error.message); else { await loadAll(); render(); }
    }
  });
  async function saveStack(items){
    const opts = Object.assign({}, sq.options, { stack: items });
    const { error } = await sb.from('survey_questions').update({ options: opts }).eq('id', sq.id);
    if(error) toast(error.message); else { toast('Stack updated'); await loadAll(); render(); }
  }
  if(sq){
    document.querySelectorAll('[data-sx]').forEach(b => b.onclick = () => {
      const items = stackItems(sq).slice();
      items.splice(+b.dataset.sx, 1);
      saveStack(items);
    });
    const stAdd = document.getElementById('st_add');
    if(stAdd) stAdd.onclick = () => {
      const n = document.getElementById('st_name').value.trim();
      if(!n){ toast('Needs a name'); return; }
      const items = stackItems(sq).slice();
      if(items.some(it => it.name.toLowerCase() === n.toLowerCase())){ toast('Already in the stack'); return; }
      items.push({ name: n, type: document.getElementById('st_type').value });
      saveStack(items);
    };
  }
  $('#nq_add').onclick = async () => {
    const label = $('#nq_label').value.trim(); if(!label){ toast('Needs a label'); return; }
    const sec = $('#nq_sec').value; let type = $('#nq_type').value;
    if(sec==='defaults') type = 'toggle';
    const key = label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40) + '_' + Math.random().toString(36).slice(2,6);
    const opts = type==='select' ? $('#nq_opts').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>({value:s.toLowerCase().replace(/[^a-z0-9]+/g,'_'),label:s})) : null;
    const defv = $('#nq_def').value === '' ? null : ($('#nq_def').value === 'true');
    const maxSort = Math.max(0, ...Q.filter(q=>q.section===sec).map(q=>q.sort_order));
    const row = { key, label, section: sec, input_type: type, min_value: type==='slider'?0:null, max_value: type==='slider'?10:null, options: opts, default_value: sec==='defaults' ? (defv===null?false:defv) : defv, sort_order: maxSort + 10 };
    const { error } = await sb.from('survey_questions').insert(row);
    if(error) toast(error.message); else { toast('Added'); await loadAll(); render(); }
  };
  loadHyp();
  $('#hyp_add').onclick = async () => {
    const t = $('#hyp_new').value.trim(); if(!t) return;
    const { error } = await sb.from('hypotheses').insert({ hypothesis: t });
    if(error) toast(error.message); else { $('#hyp_new').value=''; toast('Registered'); loadHyp(); }
  };
  $('#sout').onclick = () => sb.auth.signOut();
}
async function loadHyp(){
  const { data } = await sb.from('hypotheses').select('*').order('id');
  const el = document.getElementById('hyp'); if(!el) return;
  el.innerHTML = (data && data.length) ? data.map(x => '<div class="defrow"><div style="font-size:14px">'+esc(x.hypothesis)+'</div><div class="qmeta">'+esc(x.registered_on)+'</div></div>').join('') : '<div class="small">None yet. Register your five before the data starts talking.</div>';
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(()=>{}); }
boot();
</script></body></html>
